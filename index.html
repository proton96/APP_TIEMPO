<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clima local con JSON</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="contenedor">

  <script src="app.js"></script>

</html>
